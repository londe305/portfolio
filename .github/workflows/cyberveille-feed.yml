name: Collecte flux RSS Cyberveille

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:         # déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: cyberveille-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/cyberveille
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm install

      - name: Collecter les flux RSS
        run: node fetch-feed.mjs

      - name: Commit et push si data/ a changé
        run: |
          if [ -n "$(git status --porcelain ../../data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ../../data/cyber-feed.json ../../data/cyber-meta.json
            git commit -m "chore(cyberveille): mise à jour automatique du flux RSS"
            git push
          else
            echo "Aucun changement à publier."
          fi
