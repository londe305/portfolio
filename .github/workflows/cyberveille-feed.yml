name: Collecte flux RSS Cyberveille

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:         # déclenchement manuel depuis l'onglet Actions
  push:
    branches: [main]
    paths:
      - 'scripts/cyberveille/**'
      - '.github/workflows/cyberveille-feed.yml'
      - 'data/cyber-feed.json'
      - 'data/cyber-meta.json'

permissions:
  contents: write

concurrency:
  group: cyberveille-feed
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/cyberveille
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: scripts/cyberveille/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Collecter les flux RSS
        run: node fetch-feed.mjs

      - name: Commit et push si data/ a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cyber-feed.json data/cyber-meta.json

          if git diff --cached --quiet -- data/cyber-feed.json data/cyber-meta.json; then
            echo "Aucun changement à publier."
          else
            git commit -m "chore(cyberveille): mise à jour automatique du flux RSS"
            git push
          fi
