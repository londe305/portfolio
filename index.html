<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Londé Balossa Lotus Espoir – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<!-- Modular stylesheets — global.css first (design tokens), then one file per component -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/navigation.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/skills.css">
<link rel="stylesheet" href="css/about.css">
<link rel="stylesheet" href="css/projects.css">
<link rel="stylesheet" href="css/blogs.css">
<link rel="stylesheet" href="css/cyberveille.css">
<link rel="stylesheet" href="css/contact.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/modals.css">
<link rel="stylesheet" href="css/documentViewer.css">
<link rel="stylesheet" href="css/footer.css">
</head>
<body>
<canvas id="bg-canvas"></canvas>

<!-- ============================================================
     COMPONENT MOUNT POINTS
     Each *-mount element is filled at runtime by js/main.js,
     which fetches components/<name>.html independently. If one
     component fails to load, the others are unaffected.
     ============================================================ -->

<div id="header-mount"></div>
<div id="navigation-mount"></div>

<main id="main-content">
  <div id="hero-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">1</div><div class="sec-sep-line btm"></div></div>

  <div id="about-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">2</div><div class="sec-sep-line btm"></div></div>

  <div id="experience-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">3</div><div class="sec-sep-line btm"></div></div>

  <div id="projects-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">4</div><div class="sec-sep-line btm"></div></div>

  <div id="certifications-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">5</div><div class="sec-sep-line btm"></div></div>

  <div id="veille-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">6</div><div class="sec-sep-line btm"></div></div>

  <div id="cyberveille-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">7</div><div class="sec-sep-line btm"></div></div>

  <div id="blogs-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">8</div><div class="sec-sep-line btm"></div></div>

  <div id="contact-mount"></div>
  <div class="sec-sep"><div class="sec-sep-line"></div><div class="sec-sep-num">9</div><div class="sec-sep-line btm"></div></div>

  <div id="game-mount"></div>
</main>

<div id="footer-mount"></div>
<div id="modals-mount"></div>

<!-- ============================================================
     SCRIPTS — single ES module entry point, everything else is
     imported from there (see js/main.js).
     ============================================================ -->
<script type="module" src="js/main.js"></script>
</body>
</html>
